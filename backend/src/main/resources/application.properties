spring.application.name=sistema

# Banco H2 em arquivo (nao precisa instalar nada, roda tudo embutido na aplicacao)
spring.datasource.url=jdbc:h2:file:./data/lojadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Console web do H2 (http://localhost:8080/h2-console) - util pra ver os dados direto no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo do JWT (so para fins academicos/demo - nao usar em producao real)
app.jwt.secret=ChaveSecretaBemLongaParaAssinarOsTokensJWTDoProjetoN2TestesDeSoftware2026
app.jwt.expiracao-ms=86400000

# CORS - permite o front-end Angular (rodando em outra porta) chamar essa API
app.cors.origem-permitida=http://localhost:4200

# Exibe a mensagem de erro real nas respostas (ambiente academico/dev)
server.error.include-message=always
